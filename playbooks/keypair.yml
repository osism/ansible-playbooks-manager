---
- name: Create local ssh private key file
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    keypair_dest: "{{ playbook_dir }}/id_rsa.operator"

  tasks:
    - name: Fail if the operator private key is empty or not a private key
      ansible.builtin.assert:
        that:
          - operator_private_key | default('') | trim | length > 0
          - "'PRIVATE KEY' in (operator_private_key | default(''))"
        fail_msg: >-
          operator_private_key is empty or does not contain a private key;
          refusing to write id_rsa.operator.

    - name: Create id_operator.rsa file
      ansible.builtin.copy:
        content: "{{ operator_private_key }}"
        dest: "{{ keypair_dest }}"
        mode: 0600
