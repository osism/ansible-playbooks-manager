---
- name: Bootstrap manager node - pt. 1
  hosts: manager

  roles:
    - role: osism.commons.hostname
      tags:
        - part1
        - hostname

    - role: osism.commons.hosts
      tags:
        - part1
        - hosts

    - role: osism.commons.proxy
      tags:
        - part1
        - proxy

    - role: osism.commons.sshconfig
      # This ensures that only any extra SSH configuration configured
      # is written to the Manager at this point.
      vars:
        sshconfig_private_key_file: ""
      tags:
        - part1
        - sshconfig

    - role: osism.commons.certificates
      tags:
        - part1
        - certificates

    - role: osism.commons.resolvconf
      tags:
        - part1
        - resolvconf

    - role: osism.commons.repository
      tags:
        - part1
        - repository

- name: Bootstrap manager node - pt. 2
  hosts: manager

  roles:
    - role: osism.commons.timezone
      tags:
        - part2
        - timezone

    - role: osism.services.chrony
      tags:
        - part2
        - chrony

    - role: osism.services.docker
      tags:
        - part2
        - docker

    - role: osism.commons.docker_compose
      tags:
        - part2
        - docker
